<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso - HouseGYM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gym: {
                            black: '#0a0a0a',
                            'black-light': '#111111',
                            'black-card': '#141414',
                            'gray-dark': '#1a1a1a',
                            'gray-mid': '#2a2a2a',
                            'gray-light': '#8a8a8a',
                            white: '#ffffff',
                            'white-soft': '#e0e0e0',
                            red: '#e51a2c',
                            'red-bright': '#ff1a2e',
                            'red-dark': '#b01020',
                        }
                    },
                    fontFamily: {
                        heading: ['Outfit', 'sans-serif'],
                        body: ['Inter', 'sans-serif'],
                    },
                    backgroundImage: {
                        'gradient-red': 'linear-gradient(135deg, #ff1a2e 0%, #b01020 100%)',
                        'gradient-red-hover': 'linear-gradient(135deg, #ff3344 0%, #cc1428 100%)',
                    },
                    boxShadow: {
                        'red': '0 4px 30px rgba(229, 26, 44, 0.25)',
                        'red-hover': '0 6px 40px rgba(229, 26, 44, 0.45)',
                        'card': '0 8px 32px rgba(0, 0, 0, 0.5)',
                    },
                    keyframes: {
                        ripple: {
                            '0%': { width: '0px', height: '0px', opacity: '0.15' },
                            '100%': { width: '300px', height: '300px', opacity: '0' },
                        }
                    },
                    animation: {
                        ripple: 'ripple 0.5s ease-out forwards',
                    }
                }
            }
        }
    </script>
</head>

<body
    class="min-h-screen flex items-center justify-center bg-[#0a0a0a] p-4 md:p-8 font-body antialiased relative overflow-hidden">

    <!-- Background glows -->
    <div class="pointer-events-none absolute -top-[20%] -left-[10%] w-[500px] h-[500px] rounded-full blur-[60px]"
        style="background: radial-gradient(circle, rgba(229,26,44,0.15) 0%, transparent 70%);">
    </div>
    <div class="pointer-events-none absolute -bottom-[20%] -right-[10%] w-[500px] h-[500px] rounded-full blur-[60px]"
        style="background: radial-gradient(circle, rgba(229,26,44,0.10) 0%, transparent 70%);">
    </div>
    <!-- desenfoque de fondo de la pagina  -->

    <body
        class="h-screen flex justify-center items-center overflow-hidden [background:linear-gradient(135deg,#001b44,#004aad,#0099ff)] [background-size:400%_400%] [animation:fondoAnim_12s_infinite_alternate]">
    </body>
    <!-- imagen de fondo de la pagina  -->
    <div
        class="absolute w-full h-full bg-center bg-cover opacity-[0.18] blur-[3px] [background-image:url('hero-bg.jpg')]">
    </div>
    <!-- Card -->
    <div id="card" class="relative z-10 w-full max-w-[420px] bg-[#141414]/95 rounded-[20px] p-8 md:p-10 shadow-card border border-white/5 overflow-hidden group
              transition-all duration-300 ease-[cubic-bezier(0.25,0.46,0.45,0.94)]
              hover:-translate-y-1 hover:shadow-[0_15px_50px_rgba(0,0,0,0.6),0_0_20px_rgba(229,26,44,0.1)]
              backdrop-blur-[10px]">

        <!-- Animated top border -->
        <div
            class="absolute top-0 left-0 w-full h-[3px] bg-gradient-red scale-x-0 group-hover:scale-x-100 transition-transform duration-500 origin-left">
        </div>

        <!-- Header -->
        <div class="text-center mb-8">
            <h2 class="font-heading text-3xl font-bold uppercase mb-2 tracking-tight text-white">
                Ingreso a
                <span class="block mt-1 text-transparent bg-clip-text bg-gradient-red">HouseGYM</span>
            </h2>
            <p class="text-[#8a8a8a] text-sm font-medium mt-3">Ingresa con tu cuenta de usuario</p>
        </div>

        <!-- Form -->
        <form action="login.php" method="POST" class="space-y-5">

            <!-- Cedula -->
            <div class="space-y-2">
                <label class="block text-xs font-bold text-[#e0e0e0] uppercase tracking-wider ml-1">Cedula</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="w-5 h-5 text-[#8a8a8a]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 9h16 M4 15h16 M10 3L8 21 M16 3l-2 18" />
                        </svg>
                    </div>
                    <input type="text" inputmode="numeric" name="cedula" placeholder="Documento" required
                        class="w-full pl-11 pr-4 py-3.5 rounded-xl text-sm text-white placeholder-[#8a8a8a]/40
                        bg-[#1a1a1a] border border-white/[0.06]
                        transition-all duration-300 ease-[cubic-bezier(0.25,0.46,0.45,0.94)]
                        focus:outline-none focus:border-[rgba(229,26,44,0.5)] focus:shadow-[0_0_15px_rgba(229,26,44,0.2)] focus:bg-[#141414]">
                </div>
            </div>

            <!-- Contraseña -->
            <div class="space-y-2">
                <label class="block text-xs font-bold text-[#e0e0e0] uppercase tracking-wider ml-1">Contraseña</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="w-5 h-5 text-[#8a8a8a]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                    </div>
                    <input type="password" name="password" placeholder="••••••••" required
                        class="w-full pl-11 pr-4 py-3.5 rounded-xl text-sm text-white placeholder-[#8a8a8a]/40
                        bg-[#1a1a1a] border border-white/[0.06]
                        transition-all duration-300 ease-[cubic-bezier(0.25,0.46,0.45,0.94)]
                        focus:outline-none focus:border-[rgba(229,26,44,0.5)] focus:shadow-[0_0_15px_rgba(229,26,44,0.2)] focus:bg-[#141414]">
                </div>
            </div>

            <!-- Submit button -->
            <button type="submit" class="relative overflow-hidden w-full py-4 mt-8 rounded-full
                     font-heading font-bold text-[0.95rem] tracking-[1.5px] uppercase text-white
                     flex items-center justify-center gap-2
                     bg-gradient-red shadow-red
                     transition-all duration-300 ease-[cubic-bezier(0.25,0.46,0.45,0.94)]
                     hover:shadow-red-hover hover:-translate-y-0.5
                     hover:bg-gradient-red-hover
                     group/btn">
                Ingresar
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
                <!-- Ripple overlay -->
                <span class="absolute inset-0 flex items-center justify-center pointer-events-none">
                    <span
                        class="w-0 h-0 rounded-full bg-white/15 group-hover/btn:w-[300px] group-hover/btn:h-[300px] transition-all duration-500 ease-out"></span>
                </span>
            </button>

        </form>
    </div>

</body>

</html>
